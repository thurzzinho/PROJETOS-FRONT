<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <title>Convert</title>
  </head>
  <body>
    <img src="./img/logo.svg" alt="Convert logo" />

    <main> <!--Um elemento que só deve ser usado para armazenar o conteúdo central/principal da página, ou funcionalidades de um site que pode ser repetido em outras páginas web como barras laterais, formulários logo, -->

      <form> <!-- form é usao para um espaço de documento onde vai ter informações, lable, input..-->
        <label for="amount">valor</label> 
<!--"label"significa uma legenda para um campo de texto por exemplo e pode está associado a um ID usando "for" e fica dentro de um "form"-->

        <input type="text" name="amount" id="amount" placeholder= 0 required />
<!--"input"é um campo para inserir um valor. o type= "text" indica que é do tipo texto "placeholder" nada mais é do que um conteúdo a ser exibido no campo de um input ou formulário, dizendo algum exemplo tipo "seu nome"-->

        <label for="currency">moeda</label>
        <select name="moeda" id="currency" required> <!--(select) é para selecionar e tem q ter "option" dentro-->
          <option value="Selelect the currency" hidden>Selecione a moeda</option> <!--option o próprio nome diz opções-->
          <option value="USD">Dólar Americano</option>
          <option value="EUR">Euro</option>
          <option value="GBP">Libra Esterlina</option>
          <option value="CAD">Dólar Canadense</option>
        </select>

        <button type="submit">Converter em reais</button>
      </form>

      <footer> <!--rodapé-->
        <span id="description">US$ 1 = R$ 4,86</span> <!--span é um elemento inline (em linha/na mesma linha/do lado)-->
        <h1 id="result">486,00 Reais</h1>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
